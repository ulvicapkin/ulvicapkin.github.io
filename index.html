<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ulvi Çapkın</title><style>body{margin:0;background:#101827;color:#f3f5fa;font:16px system-ui}header{padding:25px;background:#17243a}h1{margin:0;font-size:25px}small{color:#aab9ce}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:#1b2a40;border:1px solid #35455b;border-radius:14px;padding:18px}button,input,select{border-radius:9px;padding:11px;border:1px solid #53637b;background:#263850;color:white}button{cursor:pointer;background:#2c65a5}input{width:calc(100% - 24px)}.task{padding:12px;border-bottom:1px solid #42516b}.done{text-decoration:line-through;color:#9aa}label{display:block;margin:8px 0}section{margin-top:26px}</style></head><body><header><h1>Ulvi Çapkın</h1><small>3 öncelikli proje · Yerel kayıt</small></header><main><div class="grid" id="projects"></div><section class="card"><h2>Görev Merkezi</h2><form id="form"><label>Görev açıklaması<input id="task" required placeholder="Yeni görev yazın"></label><label>Proje<select id="project"></select></label><button>Görev ekle</button></form><div id="tasks"></div></section><section><small>Bilgiler yalnızca bu tarayıcının yerel depolamasına kaydedilir. Hesap senkronizasyonu ve dış servis bağlantısı henüz yoktur.</small></section></main><script>const names=['Rüya Gemisi','Arde Doğal Ürünler — Aydın Nazilli','TersanePera'];let tasks=[];try{tasks=JSON.parse(localStorage.getItem('ulvi-tasks')||'[]')}catch(e){};const save=()=>localStorage.setItem('ulvi-tasks',JSON.stringify(tasks));const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.getElementById('projects').innerHTML=names.map(n=>`<div class="card"><h2>${n}</h2><p>${tasks.filter(t=>t.project===n&&!t.done).length} açık görev</p></div>`).join('');document.getElementById('tasks').innerHTML=tasks.length?tasks.map(t=>`<div class="task"><span class="${t.done?'done':''}">${safe(t.text)}</span><br><small>${safe(t.project)}</small><br><button data-id="${t.id}" data-action="toggle">${t.done?'Geri al':'Tamamla'}</button> <button data-id="${t.id}" data-action="delete">Sil</button></div>`).join(''):'<p>Henüz görev eklenmedi.</p>'}document.getElementById('project').innerHTML=names.map(n=>`<option>${n}</option>`).join('');document.getElementById('form').onsubmit=e=>{e.preventDefault();tasks.unshift({id:crypto.randomUUID(),text:document.getElementById('task').value,project:document.getElementById('project').value,done:false});save();document.getElementById('task').value='';render()};document.getElementById('tasks').onclick=e=>{let b=e.target.closest('button');if(!b)return;let i=tasks.findIndex(t=>t.id===b.dataset.id);if(i<0)return;if(b.dataset.action==='delete')tasks.splice(i,1);else tasks[i].done=!tasks[i].done;save();render()};render();</script></body></html>
