<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#20342d"><title>ULVİ ÇAPKIN</title><style>html,body{margin:0;background:#f1e9df;color:#20342d;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading b{font-family:Georgia,serif;letter-spacing:.12em}</style></head><body><div class="loading"><div><b>ULVİ ÇAPKIN</b><br><small>Site yükleniyor…</small></div></div><script>
const ROOT='runtime/';
const BASES=['https://raw.githubusercontent.com/ulvicapkin/ulvicapkin.github.io/bccd5b4df61bb8f766109edd70c8992f14926848/index.html','https://cdn.jsdelivr.net/gh/ulvicapkin/ulvicapkin.github.io@bccd5b4df61bb8f766109edd70c8992f14926848/index.html'];
async function txt(u){const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw Error(r.status);return r.text()}
async function oldBase(){for(const u of BASES){try{return await txt(u)}catch(e){}}throw Error('base')}
(async()=>{try{const [t0,t1,pera,base]=await Promise.all([txt(ROOT+'template0.txt'),txt(ROOT+'template1.txt'),txt(ROOT+'pera.txt'),oldBase()]);const d=new DOMParser().parseFromString(base,'text/html');const srcs=[...d.querySelectorAll('img')].map(x=>x.getAttribute('src')).filter(Boolean);if(srcs.length<6)throw Error('images');let h=t0+t1;for(let i=0;i<6;i++)h=h.split('@@IMG'+i+'@@').join(srcs[i]);h=h.split('@@IMG6@@').join(pera);document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>ULVİ ÇAPKIN</b><br><p>Sayfa yüklenemedi. Lütfen yenileyin.</p></div></div>'}})();</script></body></html>
